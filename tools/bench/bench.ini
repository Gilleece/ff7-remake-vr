; ff7vr.ini for benchmark runs (tools/bench). Only the measurement tools are
; on: the frame timer hooks Present and records frame times, nothing renders.
; Configurations of the mod add their own keys with -Set style overrides
; (see tools/bench/configs.psd1).

[log]
level = info

[crash]
enabled = 1
; Off: injected tools such as UEVR raise and handle exceptions on purpose
; while scanning; reporting them first-chance would write dumps mid-run.
first_chance = 0

[dev]
pipe = 1
virtual_pad = 0

[bench]
frame_timer = 1
force_sync_interval = -1
