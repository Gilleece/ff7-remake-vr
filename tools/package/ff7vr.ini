; ff7vr.ini - settings of the VR mod for FINAL FANTASY VII REMAKE INTERGRADE.
;
; With the launcher, edit this file next to start-vr.cmd: the launcher copies it next to
; the game for every session. With the mod installed by hand (GUIDE.md, "Installing without
; the launcher"), edit the copy in the game's End\Binaries\Win64 folder. Lines starting
; with ; are comments. A key that is missing uses the built-in default, which is the value
; written here unless the comment says otherwise. The settings worth knowing are described
; in README.md.

[xr]
backend = openxr            ; openxr = a real headset. (null = no headset at all, for testing only)
runtime = auto              ; auto = use the first OpenXR runtime that has a headset connected: those whose
                            ; PC app runs first (Virtual Desktop Streamer, SteamVR, Meta Quest Link, ...),
                            ; then the PC's default, then the others. To pin one: virtualdesktop, steamvr,
                            ; system (the PC's default) or the path of a runtime's .json file. This choice
                            ; is for this game only; the PC's default runtime is never changed
resolution_scale = 1.0      ; per-eye render size as a fraction of what the headset's runtime asks for.
                            ; 0.8 = 64 % of the pixels: faster, softer. Above 1.0: sharper, slower
retry_interval = 5          ; seconds between attempts to reach the headset while it is not connected

[stereo]
enabled = 1                 ; 1 = 3D: the game is rendered for each eye. 0 = no 3D: the game is shown on a
                            ; flat virtual screen in the headset instead (the fallback if 3D misbehaves)
start_in_stereo = 1         ; 3D from the start (the title screen and menus are on the virtual screen anyway)
world_scale = 1.0           ; size of the world. Above 1.0 the world looks smaller (you become a giant),
                            ; below 1.0 it looks larger
decoupled_pitch = 1         ; 1 = the horizon stays level: the game camera only turns you left and right,
                            ; you look up and down with your head. 0 = the game camera's tilt is applied too
positional = 1              ; 1 = leaning and moving your head moves the view. 0 = rotation only
mirror = crop               ; what the monitor shows in 3D: crop (left eye, cropped), left, right, both, off
movie_screen = 0            ; 1 = show pre-rendered movies on the virtual screen. Off because it was never seen
                            ; working; worth a try if movies look broken in 3D
comfort_cvars = 1           ; 1 = camera motion blur and chromatic aberration off while in 3D. 0 = as in the flat game
vr_window = 1280x720        ; window size the game switches to while 3D runs, if it was in a fullscreen mode
                            ; (3D does not work in the fullscreen modes). 0 = leave the mode alone
ao_fix = 1                  ; 1 = the right eye's ambient occlusion (the soft shading in corners and under
                            ; objects) is computed from the right eye's own view. Without it the right eye shows
                            ; a dark ghost copy of nearby objects, off to the side. 0 = off, only to compare or if
                            ; the right eye's shading looks wrong in a scene
light_fix = 1               ; 1 = indoor lamps light characters and rooms correctly in 3D. Without it, indoors,
                            ; characters' skin shows white square blocks and lamp light is missing in the lower
                            ; part of the view. Applied only while 3D renders; the flat game is unchanged.
                            ; 0 = off, only to compare
ssr_fix = 1                 ; 1 = the right eye gets its own screen-space reflections (on wet floors, metal,
                            ; glass). Without it the right eye has none. 0 = off, only to compare
tonemap_shift = auto        ; for the Luma add-on: with Luma loaded, the right eye's colour pass read the left
                            ; eye's image; this corrects it. auto = only while Luma is loaded (leave it so),
                            ; 1 = always (breaks the right eye without Luma), 0 = off
render_scale = 1.0          ; share of each eye's width and height that the game renders, 0.3 to 1.0. 0.9 is about
                            ; 12 % faster, 0.8 about 26 %, softer. Works together with foveated rendering
dynamic_resolution = 0      ; 1 = render_scale is lowered and raised by itself to hold the headset's frame rate.
                            ; 0 = off (leave it off with DLSS)

[camera]
boom = level                ; level = in third person you stay at the character's shoulder height while the camera
                            ; orbits. game = the game camera's own position (it rises and sinks with its tilt)

[first_person]
enabled = 1                 ; 1 = first person can be used. 0 = never (no key, no pad combination, no automatic switch)
default = 1                 ; 1 = first person outside battles: 3D starts in first person and returns to it after
                            ; every battle. 0 = third person
auto_combat = 1             ; 1 = third person while a battle is in progress (see battle_signal). 0 = no automatic switch
battle_signal = EndBattleAPI.GetBattleSceneID result=0:4
                            ; how the mod tells that a battle is in progress. Not yet seen in a real battle: if
                            ; battles stay in first person or exploration switches to third person, leave it empty
                            ; (battle_signal = ) and set default = 0
toggle_key = 36             ; keyboard key that switches first/third person, as a Windows virtual-key code
                            ; (36 = Home, 0 = no key). On a gamepad: hold View/Back, click the right stick
pad_toggle = 1              ; 1 = the gamepad combination View/Back + right stick click switches too. 0 = off
blend_seconds = 0.35        ; seconds the move between third and first person takes
hide = meshes               ; meshes = hide the character (and the sword) in first person. none = hide nothing

[controls]
; Keys work while the game window has the focus; values are Windows virtual-key codes, 0 = no key.
; On a gamepad: hold View/Back and press the button named in the comment.
recenter_key = 35           ; End (pad: left stick click): what you face now becomes forward; the panels move in front of you
stereo_key = 45             ; Insert (pad: Menu/Start): 3D off (game on the virtual screen) and on again;
                            ; reconnects the headset if it has lost the game
ui_nearer_key = 34          ; Page Down (pad: D-pad down): HUD/menu panel nearer by ui_step
ui_farther_key = 33         ; Page Up (pad: D-pad up): HUD/menu panel farther by ui_step
ui_step = 0.25              ; metres per press; the panel stays between ui_min and ui_max
ui_min = 0.75
ui_max = 8
pad = 1                     ; 1 = the View/Back combinations above work. 0 = off (the first-person one is [first_person] pad_toggle)
pad_hold_view = 1           ; 1 = View/Back alone reaches the game when you release it (so the map does not open on the
                            ; way to a combination). 0 = View/Back reaches the game at once

[ui]
layer = 1                  ; 1 = HUD and menus on their own floating panel in 3D. 0 = inside the 3D image
                            ; (cropped at the edges; for comparison only)
distance = 3.0              ; metres from your head to the HUD/menu panel
size = 2.0                  ; height of the panel in metres (width follows at 16:9). 1.57 lines the markers
                            ; over enemies up with the enemies; 2.0 is larger and easier to read
follow_head = 0             ; 0 = the panel stays where it is when you turn your head. 1 = it follows your head

[screen]
distance = 2.0              ; virtual screen (title, menus, loading, and everything when [stereo] enabled = 0):
width = 1.8                 ; distance and width in metres. 1.8 m at 2 m is about 48 degrees wide

[foveation]
enabled = 1                 ; 1 = the outer edges of each eye are drawn at a lower detail to save GPU time
                            ; (NVIDIA graphics cards only; switches itself off on others). 0 = off
preset = performance        ; performance (the author could not tell it from off on a Quest 3) | balanced |
                            ; quality (smaller saving) | off
eye_tracking = 0            ; 1 or auto = the full-detail area follows your eyes on a headset with eye tracking
                            ; (Quest Pro, PICO 4 Pro); not yet tested with a real one. 0 = fixed at the centre
gaze_margin_deg = 5         ; degrees added around where you look while eye tracking moves the full-detail area
gaze_smoothing = 0.5        ; 0 to 0.95: how much small eye movements are steadied; larger ones jump at once
subsurface_full_rate = 1    ; 1 = skin edges stay clean in the lower-detail rings. 0 only to compare

[dlss]
; NVIDIA DLSS: each eye is rendered smaller and DLSS rebuilds it at the full size, with nearly the
; detail of rendering at full size. Needs an NVIDIA RTX graphics card and the -dlss package (its
; folder name ends in -dlss); other packages ignore this section. GUIDE.md, "DLSS".
; Not yet seen in a headset. Earlier -dlss packages could hang the graphics card, within seconds
; at the title screen; the cause was in the mod and is fixed (tested without a headset: the title
; screen, and 20 minutes of play with foveated rendering off and 20 with it on). In the NVIDIA
; App, leave this game's "DLSS override - Super Resolution" at the application's choice: if it
; forces DLAA, DLSS cannot upscale and the game's own image is shown (the log says so).
; At high Virtual Desktop resolutions the graphics card can run out of memory and frames become
; very slow: see r.Streaming.PoolSize under [stereo_cvars] at the end of this file.
enabled = 0                 ; 1 = on. 0 = off: the game's own anti-aliasing at the full size
mode = upscale              ; upscale = render smaller, DLSS scales up (the useful mode). dlaa = DLSS at the
                            ; full size (sharper than the game's own anti-aliasing, but far too slow at headset
                            ; resolution)
input_scale = 0.5           ; share of each eye's width and height that is rendered before DLSS scales it up.
                            ; 0.5 = a quarter of the pixels: costs about what the game costs at full size
                            ; (with DLSS's newest model), close to it in detail, grainier hair and soft shadow
                            ; edges. 0.67 = calmer and sharper, costs clearly more. To render about as much as
                            ; before and get a sharper picture, raise the resolution in Virtual Desktop and
                            ; lower this to match (GUIDE.md, "DLSS"). Leave [stereo] dynamic_resolution off
output = runtime            ; runtime = the game renders at input_scale of the headset's resolution and DLSS
                            ; writes the headset's resolution (video memory as for the smaller size). engine =
                            ; the earlier way: the game's buffers at the headset's resolution, only the rendered
                            ; part smaller (needs the memory of the full size)
preset = default            ; DLSS model: default (NVIDIA's choice), k, l or m. The NVIDIA App's DLSS override for
                            ; this game, if set, decides instead

[loader]
force_d3d11 = 1             ; 1 = the mod adds -d3d11 to the game's command line when no graphics option is
                            ; there, so the game uses Direct3D 11 (the mod needs it) also when started from
                            ; Steam. 0 = leave the command line alone (then add -d3d11 to the launch options)

[log]
level = debug               ; how much goes into ff7vr.log: error, warn, info, debug, trace. debug is right
                            ; for the first sessions; info keeps it shorter (built-in default: info)
keep_sessions = 5           ; logs and crash dumps of this many earlier sessions are kept in ff7vr-logs\ next
                            ; to ff7vr.log (only when the mod stays installed; the launcher keeps its own logs\).
                            ; 0 = keep none, every session overwrites ff7vr.log

[crash]
enabled = 1                 ; write a crash report and a small crash dump next to the log if the game crashes
first_chance = 1

[dev]
pipe = 0                    ; developer command pipe: off
virtual_pad = 0             ; developer test input: off

[stereo_cvars]
; The game's console variables, one per line as  name = value. They are set only while 3D renders;
; the game's own value is put back when 3D stops (for example with Insert).
; Remove the ; at the start of a line to use it; put a ; in front of a line to switch it off.
; r.BloomQuality = 0        ; bloom (the glow around bright light) off: the picture looks a little less washed out
; r.Streaming.PoolSize = 2500   ; the game's texture streaming pool in MB (4000 by default). Lowering it to 2500
                                ; kept a 4608x4224 DLSS session from filling the graphics card (when the card is
                                ; full, frames take 85 to 136 ms), with no loss of sharpness seen in one comparison.
                                ; Use it when the log's "video memory:" line warns that the card is full
; Level of detail: each eye's wide field of view makes the engine treat everything as smaller on
; screen, so it drops to lower detail levels much nearer than in the flat game, and first person
; brings you closer to things. These four push the detail levels out again (a big visible gain in
; the headset; the cost in frame time and video memory has not been measured).
r.StaticMeshLODDistanceScale = 0.5    ; 0.5 = detail levels of static meshes switch at twice the distance
r.SkeletalMeshLODBias = -1            ; characters one detail level higher
foliage.LODDistanceScale = 2          ; foliage detail levels switch at twice the distance
r.ViewDistanceScale = 1.5             ; small objects stay visible 1.5 times as far
