; ff7vr.ini - development defaults, deployed next to the DLL by tools/dev/deploy.ps1.
; Every key is optional; missing keys use the defaults in code (noted below).

[log]
; trace | debug | info | warn | error        (code default: info)
level = debug
keep_sessions = 5    ; earlier logs and crash dumps kept in ff7vr-logs\ beside the log; 0 = none (default 5)

[loader]
force_d3d11 = 1      ; add -d3d11 to the command line when it has no graphics option (default 1)

[crash]
enabled = 1          ; (default 1)
first_chance = 1     ; report first-chance fatal exceptions, needed because UE4 catches crashes itself (default 1)
max_reports = 8      ; (default 8)
max_dumps = 2        ; (default 2)
full_memory = 0      ; full-memory minidumps are several GB for this game (default 0)

[dev]
pipe = 1             ; \\.\pipe\ff7vr-dev command pipe (ping, log markers) for tools/dev/send-input.ps1 (default 0)
virtual_pad = 1      ; inject a virtual XInput pad on user index 0 (default 0). Only has an effect
                     ; if the game polls XInput; this build does not without a physical pad

[debug]
crash_after_seconds = 0   ; >0: crash on purpose after N seconds to test the crash handler (default 0)

[stereo]
enabled = 1          ; stereo device in the engine (default 1); 0 = the game runs unmodified. Every key: docs/engine-module.md
start_in_stereo = 1  ; (default 1) frames are stereo only while the XR session can show them; mono otherwise
host = render        ; render = eye size and views from the XR session below; fixed = ini values, no XR (default render)
mirror = crop        ; desktop window while in stereo: crop | left | right | both | off (default crop)
decoupled_pitch = 1  ; ignore the game camera's pitch and roll so the horizon stays level (default 1)
world_scale = 1.0    ; (default 1.0)
ao_fix = 1           ; right eye's ambient occlusion from its own view; 0 shows the left view's ghost (default 1)
light_fix = 1        ; light sort-key patch, only while stereo renders (mono unchanged): without it, indoors, white
                     ; blocks on skin and lamp light cut off in the lower part of the eyes; 0 only to compare (default 1)
game_vignette = 0    ; share of the game's lens vignette kept in stereo: 0 none (default), 1 as in the flat game
ssr_fix = 1          ; right eye's screen-space reflections from its own view; without it the right eye has none;
                     ; 0 only to compare (default 1)
tonemap_shift = auto ; auto | 1 | 0: with Luma loaded the right view's tonemapping read the left view's image; this
                     ; corrects it. auto = only while Luma is loaded, 1 = always (breaks the right eye without Luma),
                     ; 0 = off (default auto)

[render]
enabled = 1          ; D3D11 hooks and the XR session (default 1). See docs/render.md for every key
stats_interval = 10  ; seconds between timing reports in ff7vr.log (default 10)

[xr]
enabled = 1               ; (default 1) 0 = hooks and timing only, no XR session
backend = openxr          ; openxr | null (default openxr)
runtime = auto            ; auto | virtualdesktop | steamvr | system | inherit | <path to runtime json> (default auto:
                          ; the first runtime found that has a headset, running ones first)
frame_wait = thread       ; thread | present (default thread)
disable_implicit_layers = reshade  ; implicit OpenXR layers off for the game: none | all | name parts (default reshade)

[screen]
distance = 2.0       ; metres (default 2.0)
width = 1.8          ; metres, about 48 degrees wide at 2 m (default 1.8)

[picture]
; colour adjustment of the eye images and the virtual screen, not the UI layer; the defaults change
; nothing (docs/render.md, "Picture controls"); live: dev command `picture`
brightness = 0       ; -1..1 stops, a gain on linear light (default 0)
contrast = 1.0       ; 0.5..2, a slope in stops around 18 % grey; black stays black (default 1)
saturation = 1.0     ; 0..2 around the pixel's luminance, which is kept (default 1)
gamma = 1.0          ; 0.5..2, e^(1/gamma) on the sRGB-encoded value; above 1 brighter mid-tones (default 1)
black_level = 0      ; -0.1..0.1, e * (1 - b) + b on the sRGB-encoded value (default 0)

[controls]
; keys for the colour adjustment (virtual-key codes, 0 = none); the other keys: docs/engine-module.md
brightness_up_key = 0     ; [picture] brightness + brightness_step per press (default 0)
brightness_down_key = 0   ; (default 0)
brightness_step = 0.05    ; (default 0.05)
pad_log = 0               ; log the first N gamepad state changes in and out of the pad filter (default 0)

[foveation]
; NVIDIA only; every key: docs/render.md, "Foveated rendering"
enabled = 1               ; (default 1)
preset = quality          ; quality | balanced | performance | off (default quality)
eye_tracking = 0          ; 0 | 1 | auto: the full-rate zone follows the eye gaze on a headset with eye tracking;
                          ; untested with a real one (default 0)
gaze_margin_deg = 5       ; degrees added to the full-rate zone while the gaze drives it (default 5)
gaze_smoothing = 0.5      ; 0 to 0.95: weight of the previous centre for gaze movements under 2 degrees (default 0.5)
subsurface_full_rate = 1  ; skin edges stay clean in the coarse rings; 0 only to compare (default 1)
dlss_finer = 1            ; while DLSS upscales, one step finer than the preset: performance as balanced,
                          ; balanced as quality; 0 = the preset as set (default 1)

[dlss]
; Only in a build with -DFF7VR_DLSS=ON (the -dlss package; docs/dlss.md); every key: docs/dlss.md,
; "Settings". The GPU hangs of earlier builds came from a draw inside a device context state of the
; mod's own and are fixed (docs/dlss.md, "GPU faults"). The blocky dots seen with DLSS are foveated
; rendering's coarse edges, which DLSS keeps sharp; [foveation] dlss_finer = 1 (default) shades one
; step finer than the preset while DLSS upscales (docs/dlss.md, "The dots").
enabled = 0          ; DLSS in place of the game's anti-aliasing while stereo renders (default 0)
mode = upscale       ; upscale | dlaa (default upscale)
input_scale = 0.5    ; rendered share of each eye per axis in upscale mode (default 0.5)
output = runtime     ; runtime: the engine renders at input_scale of the runtime's eye size, DLSS writes the
                     ; runtime's size | engine: the engine's eye at the runtime's size, the views at input_scale
                     ; of it ([stereo] render_scale) (default runtime)
preset = default     ; default | j | k | l | m; the NVIDIA App's override for the game wins (default default)
firefly = 0          ; NGX's UseFireflySwatter hint (default 0)
texture_bias = off   ; mip bias of the game's anisotropic samplers while DLSS upscales: off | auto (log2 of
                     ; the input's share) | auto-1 | a negative number (default off)

[stereo_cvars]
; console variables held only while the engine renders in stereo, put back when stereo stops
; r.BloomQuality = 0   ; bloom off
; r.Streaming.PoolSize = 2500   ; texture streaming pool in MB (game default 4000); 2500 kept a 4608x4224 DLSS
                                ; session off a full card (85-136 ms frames otherwise), no sharpness loss seen in
                                ; one comparison; use when the log's "video memory:" line warns that the card is
                                ; full (docs/benchmarking.md, "Video memory and slow phases")
r.StaticMeshLODDistanceScale = 0.5    ; detail levels further out: the wide per-eye FOV makes the engine
r.SkeletalMeshLODBias = -1            ; see everything as smaller on screen (player default; cost unmeasured)
foliage.LODDistanceScale = 2
r.ViewDistanceScale = 1.5
