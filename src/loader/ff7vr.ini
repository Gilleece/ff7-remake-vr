; ff7vr.ini - development defaults, deployed next to the DLL by tools/dev/deploy.ps1.
; Every key is optional; missing keys use the defaults in code (noted below).

[log]
; trace | debug | info | warn | error        (code default: info)
level = debug

[crash]
enabled = 1          ; (default 1)
first_chance = 1     ; report first-chance fatal exceptions, needed because UE4 catches crashes itself (default 1)
max_reports = 8      ; (default 8)
max_dumps = 2        ; (default 2)
full_memory = 0      ; full-memory minidumps are several GB for this game (default 0)

[dev]
pipe = 1             ; \\.\pipe\ff7vr-dev command pipe (ping, log markers) for tools/dev/send-input.ps1 (default 0)
virtual_pad = 1      ; inject a virtual XInput pad on user index 0 (default 0). Only has an effect
                     ; if the game polls XInput; this build does not without a physical pad

[debug]
crash_after_seconds = 0   ; >0: crash on purpose after N seconds to test the crash handler (default 0)

[stereo]
enabled = 0          ; stereo device in the engine (default 0); 0 = the game runs unmodified. Every key: docs/engine-module.md
start_in_stereo = 1  ; (default 1) frames are stereo only while the XR session can show them; mono otherwise
host = render        ; render = eye size and views from the XR session below; fixed = ini values, no XR (default render)
mirror = crop        ; desktop window while in stereo: crop | left | right | both | off (default crop)
decoupled_pitch = 1  ; ignore the game camera's pitch and roll so the horizon stays level (default 1)
world_scale = 1.0    ; (default 1.0)

[render]
enabled = 1          ; D3D11 hooks and the XR session (default 1). See docs/render.md for every key
stats_interval = 10  ; seconds between timing reports in ff7vr.log (default 10)

[xr]
enabled = 1               ; (default 1) 0 = hooks and timing only, no XR session
backend = openxr          ; openxr | null (default openxr)
runtime = virtualdesktop  ; virtualdesktop | steamvr | system | inherit | <path to runtime json> (default virtualdesktop)
frame_wait = thread       ; thread | present (default thread)
disable_implicit_layers = reshade  ; implicit OpenXR layers off for the game: none | all | name parts (default reshade)

[screen]
distance = 2.0       ; metres (default 2.0)
width = 1.8          ; metres, about 48 degrees wide at 2 m (default 1.8)
